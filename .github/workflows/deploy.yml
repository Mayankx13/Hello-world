name: Deploy LIQO to Cloudflare

# Deploys EVERYTHING to Cloudflare from CI — no local machine needed:
#   1. apply D1 schema   2. API Worker   3. Sync Worker (hourly cron)
#   4. seed inventory     5. the PWA (Pages)   6. the marketing site (Pages)
#
# Custom domain (amaflip.in) is wired by repo variables — see docs/DOMAIN-SETUP.md.
# Without them the stack still deploys to *.workers.dev / *.pages.dev unchanged.
#
# Runs on push once you set the repo variable DEPLOY_ENABLED=true, or any time
# via the "Run workflow" button (Actions tab). See DEPLOY.md for first-time setup.

on:
  push:
    branches: [claude/wizardly-turing-48zn7z, main, master]
  workflow_dispatch:

concurrency:
  group: liqo-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Don't run on push until you opt in (so the repo isn't red before setup).
    if: ${{ vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      INVENTORY_URL: ${{ vars.INVENTORY_URL }}
      # Custom-domain wiring (all optional — unset = *.workers.dev / *.pages.dev).
      API_CUSTOM_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}   # e.g. api.amaflip.in
      APP_API_BASE: ${{ vars.APP_API_BASE }}             # e.g. https://api.amaflip.in
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}                 # e.g. app.amaflip.in
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}               # e.g. amaflip.in
      SITE_DOMAIN_WWW: ${{ vars.SITE_DOMAIN_WWW }}       # e.g. www.amaflip.in
      # Pages project names (global on pages.dev — override if taken).
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}           # app, default "liqo-app"
      SITE_PROJECT: ${{ vars.SITE_PROJECT }}             # site, default "liqo-site"
      LLM_RATIONALE: ${{ vars.LLM_RATIONALE }}           # "on" to enable Phase 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight — required secrets present
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see DEPLOY.md)"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Install workspace deps
        run: npm install --no-audit --no-fund

      - name: Engine tests (gate the deploy)
        run: npm test

      - name: Ensure D1 database exists
        run: |
          # Use the provided id; else find the 'liqo' database; else create it.
          # Makes the deploy one-shot — no manual D1 step needed.
          if [ -n "${D1_DATABASE_ID}" ]; then
            echo "Using provided D1_DATABASE_ID"
            id="${D1_DATABASE_ID}"
          else
            echo "D1_DATABASE_ID not set — resolving the 'liqo' database…"
            id=$(npx wrangler d1 list --json 2>/dev/null \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((x.get('uuid') or x.get('database_id','') for x in d if x.get('name')=='liqo'),''))" 2>/dev/null || true)
            if [ -z "$id" ]; then
              echo "Creating D1 database 'liqo'…"
              npx wrangler d1 create liqo | tee /tmp/d1.log || true
              id=$(grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/d1.log | head -1)
            fi
          fi
          if [ -z "$id" ]; then echo "::error::Could not resolve or create the D1 'liqo' database id"; exit 1; fi
          echo "D1_ID=$id" >> "$GITHUB_ENV"
          echo "Using D1 database id: $id"

      - name: Inject config into wrangler files
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${D1_ID}/" \
            worker-api/wrangler.toml worker-sync/wrangler.toml
          # Point the Sync Worker at the real feed (else the bundled seed).
          if [ -n "${INVENTORY_URL}" ]; then
            printf '\nINVENTORY_URL = "%s"\n' "${INVENTORY_URL}" >> worker-sync/wrangler.toml
          fi
          # Turn on the LLM rationale layer (Phase 5) if requested.
          if [ "${LLM_RATIONALE}" = "on" ]; then
            sed -i 's/^LLM_RATIONALE = .*/LLM_RATIONALE = "on"/' worker-api/wrangler.toml
          fi
          # Bind the API Worker to a custom domain (auto-provisions DNS + cert).
          # Appended as its own top-level table-array so it is NOT nested in [vars].
          if [ -n "${API_CUSTOM_DOMAIN}" ]; then
            printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "${API_CUSTOM_DOMAIN}" >> worker-api/wrangler.toml
            echo "API Worker will bind to https://${API_CUSTOM_DOMAIN}"
          fi

      - name: Apply D1 schema (idempotent)
        working-directory: worker-api
        run: npx wrangler d1 execute liqo --remote --file=../schema.sql --yes

      - name: Seed reference data (idempotent)
        working-directory: worker-api
        run: npx wrangler d1 execute liqo --remote --file=../seed.sql --yes

      - name: Deploy API Worker
        working-directory: worker-api
        run: |
          npx wrangler deploy | tee /tmp/api.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/api.log | head -1)
          echo "API_URL=$url" >> "$GITHUB_ENV"
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          if [ -n "${AUTH_SECRET}" ]; then printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET; fi
          if [ -n "${ANTHROPIC_API_KEY}" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi

      - name: Deploy Sync Worker (hourly cron)
        working-directory: worker-sync
        run: |
          npx wrangler deploy | tee /tmp/sync.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/sync.log | head -1)
          echo "SYNC_URL=$url" >> "$GITHUB_ENV"
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Seed inventory snapshot (first run)
        run: |
          echo "Seeding via ${SYNC_URL}/sync"
          curl -fsS -X POST "${SYNC_URL}/sync" \
            -H "authorization: Bearer ${ADMIN_TOKEN}" || echo "::warning::seed call failed (cron will retry hourly)"

      - name: Build PWA (pointed at the API)
        working-directory: web
        run: |
          # Prefer the custom API domain when provided, else the workers.dev URL.
          api_base="${APP_API_BASE:-$API_URL}"
          echo "VITE_API_BASE=${api_base}" > .env.production
          echo "Building app against API ${api_base}"
          npm run build

      - name: Deploy PWA to Cloudflare Pages
        working-directory: web
        run: |
          project="${PAGES_PROJECT:-liqo-app}"
          echo "PAGES_PROJECT_NAME=$project" >> "$GITHUB_ENV"
          npx wrangler pages project create "$project" --production-branch=production 2>/dev/null || true
          npx wrangler pages deploy dist --project-name="$project" --branch=production --commit-dirty=true

      - name: Deploy marketing site to Cloudflare Pages
        run: |
          project="${SITE_PROJECT:-liqo-site}"
          echo "SITE_PROJECT_NAME=$project" >> "$GITHUB_ENV"
          npx wrangler pages project create "$project" --production-branch=production 2>/dev/null || true
          npx wrangler pages deploy site --project-name="$project" --branch=production --commit-dirty=true

      - name: Attach custom domains (optional)
        run: |
          attach() {  # $1=pages project  $2=hostname
            [ -z "$2" ] && return 0
            if curl -fsS -X POST \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/$1/domains" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "content-type: application/json" \
                --data "{\"name\":\"$2\"}" >/dev/null 2>&1; then
              echo "attached $2 -> $1"
            else
              echo "::warning::could not attach $2 to $1 (add it once in the Pages dashboard)"
            fi
          }
          attach "${PAGES_PROJECT_NAME}" "${APP_DOMAIN}"
          attach "${SITE_PROJECT_NAME}" "${SITE_DOMAIN}"
          attach "${SITE_PROJECT_NAME}" "${SITE_DOMAIN_WWW}"

      - name: Summary
        run: |
          {
            echo "### LIQO deployed 🚀"
            echo "- Marketing: https://${SITE_DOMAIN:-$SITE_PROJECT_NAME.pages.dev}"
            echo "- App:  https://${APP_DOMAIN:-$PAGES_PROJECT_NAME.pages.dev}"
            echo "- API:  https://${API_CUSTOM_DOMAIN:-${API_URL#https://}}"
            echo "- Sync: ${SYNC_URL}  (hourly cron)"
            if [ "${LLM_RATIONALE}" = "on" ]; then echo "- AI rationale: ON (Claude Haiku 4.5)"; fi
          } >> "$GITHUB_STEP_SUMMARY" || true
