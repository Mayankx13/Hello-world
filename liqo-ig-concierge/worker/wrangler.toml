# liqo-ig-concierge — Worker config.
# Phase 1: only the D1 binding is used (npm run db:apply / db:migrate).
# Phase 2 adds the Hono app at src/index.ts and the route for the public
# webhook endpoint. Secrets (META_VERIFY_TOKEN, META_APP_SECRET,
# N8N_WEBHOOK_URL, DASH_API_KEY) are set with `wrangler secret put` — never here.

name = "liqo-concierge"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# workers.dev stays on: Meta's webhook and the BUSY importer call the Worker
# at https://liqo-concierge.<account>.workers.dev (NOT behind Cloudflare
# Access — the webhook is protected by the Meta signature, /api/* by the key).
workers_dev = true

# ── Amaflip-branded custom domain ───────────────────────────────────────────
# This account's workers.dev subdomain is `sbinfraprojects` (a DIFFERENT
# client), so the raw origin is liqo-concierge.sbinfraprojects.workers.dev.
# Put an amaflip.in host in front so nothing public carries SB Infra's name —
# that branded host is what goes to Meta and the dashboard, not the raw origin.
#
# PREREQUISITE: amaflip.in must be an ACTIVE ZONE in this Cloudflare account
# first (it is not yet — only sbinfraprojects.net is). Add it via the registrar
# nameserver change (see README), THEN uncomment ONE block below and
# `npm run deploy:worker` — wrangler provisions the custom domain + DNS record.
#
# A) dedicated webhook/API host (recommended — decoupled from the dashboard):
# routes = [
#   { pattern = "hook.amaflip.in", custom_domain = true }
# ]
#
# B) or fold onto the dashboard domain (Workers routes beat Pages on match;
#    keep the Cloudflare Access policy on command.amaflip.in covering /api/*):
# routes = [
#   { pattern = "command.amaflip.in/webhook", zone_name = "amaflip.in" },
#   { pattern = "command.amaflip.in/api/*",  zone_name = "amaflip.in" },
# ]

[[d1_databases]]
binding = "DB"
database_name = "liqo_concierge"
database_id = "4dcf2c0f-722b-4ef1-97db-a12514dfa86c"
migrations_dir = "../schema/migrations"

[vars]
USD_INR = "87"                        # cost conversion default; override per env
