name = "liqo-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Cron-driven; no public *.workers.dev URL needed (avoids the deploy error).
workers_dev = false

# Hourly refresh from the source of truth.
[triggers]
crons = ["0 * * * *"]

# SAME D1 database as the API worker — paste the id from `wrangler d1 create liqo`.
[[d1_databases]]
binding = "DB"
database_name = "liqo"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Production: point at the BUSY-synced DBMS/HTTP feed (JSON array or .csv).
# Leave unset to seed from the bundled liqo_inventory.json.
# INVENTORY_URL = "https://feed.internal.liqo.example/inventory.json"
# INVENTORY_FORMAT = "json"   # or "csv"
# INVENTORY_SOURCE = "url"    # force a source: "seed" | "url" (else inferred)
# Cloud DBMS cutover (Hyperdrive) + column contract: see docs/DATA-SOURCES.md

# Secrets (not vars):
#   wrangler secret put ADMIN_TOKEN     # to allow POST /sync
#   wrangler secret put INVENTORY_AUTH  # optional bearer for the feed
